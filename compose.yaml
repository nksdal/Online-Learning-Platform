name: online-learning-platform

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SQLSERVER_HOST_PORT:-14330}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${MSSQL_SA_PASSWORD}
        - -C
        - -Q
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command:
      - dotnet
      - tool
      - run
      - dotnet-ef
      - --
      - database
      - update
      - --project
      - src/OnlineLearningPlatform.Infrastructure/OnlineLearningPlatform.Infrastructure.csproj
      - --startup-project
      - src/OnlineLearningPlatform.Api/OnlineLearningPlatform.Api.csproj
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=OnlineLearningPlatform;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Swagger__Enabled: "true"
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=OnlineLearningPlatform;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Authentication__Jwt__Issuer: OnlineLearningPlatform
      Authentication__Jwt__Audience: OnlineLearningPlatform.AngularClient
      Authentication__Jwt__AccessTokenMinutes: 15
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:?Set EMAIL_FROM_ADDRESS to an address on your verified sending domain}
      Email__FromName: ${EMAIL_FROM_NAME:-Nikladori}
      Email__VerificationPageUrl: ${EMAIL_VERIFICATION_URL:-http://localhost:4200/verify-email}
      Email__PasswordResetPageUrl: ${EMAIL_PASSWORD_RESET_URL:-http://localhost:4200/reset-password}
      Email__Smtp__Host: ${EMAIL_SMTP_HOST:-smtp.resend.com}
      Email__Smtp__Port: ${EMAIL_SMTP_PORT:-587}
      Email__Smtp__UseStartTls: ${EMAIL_SMTP_USE_STARTTLS:-true}
      Email__Smtp__UserName: ${EMAIL_SMTP_USERNAME:-resend}
      Email__Smtp__Password: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-5220}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  sqlserver-data:
