name: online-learning-platform

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SQLSERVER_HOST_PORT:-14330}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${MSSQL_SA_PASSWORD}
        - -C
        - -Q
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command:
      - dotnet
      - tool
      - run
      - dotnet-ef
      - --
      - database
      - update
      - --project
      - src/OnlineLearningPlatform.Infrastructure/OnlineLearningPlatform.Infrastructure.csproj
      - --startup-project
      - src/OnlineLearningPlatform.Api/OnlineLearningPlatform.Api.csproj
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=OnlineLearningPlatform;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Swagger__Enabled: "true"
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=OnlineLearningPlatform;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Authentication__Jwt__Issuer: OnlineLearningPlatform
      Authentication__Jwt__Audience: OnlineLearningPlatform.AngularClient
      Authentication__Jwt__AccessTokenMinutes: 15
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Email__FromAddress: no-reply@online-learning-platform.local
      Email__FromName: Online Learning Platform
      Email__VerificationPageUrl: http://localhost:4200/verify-email
      Email__PasswordResetPageUrl: http://localhost:4200/reset-password
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: 1025
      Email__Smtp__UseStartTls: "false"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-5220}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  sqlserver-data:
  mailpit-data:
